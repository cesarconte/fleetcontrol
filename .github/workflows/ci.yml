name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  branch-check:
    name: Validar nombre de rama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check branch name
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          case "$branch" in
            main|dev|feature/*|fix/*|chore/*|docs/*|ci/*|refactor/*|test/*)
              echo "✅ Rama válida: $branch" ;;
            *)
              echo "❌ Nombre de rama inválido: '$branch'"
              echo "   Usa: feature/*, fix/*, chore/*, docs/*, ci/*, refactor/*, test/*"
              exit 1 ;;
          esac

  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    needs: branch-check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm test

  e2e:
    name: E2E (Cypress)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          start: npm run preview
          wait-on: 'http://localhost:4173'
          wait-on-timeout: 60
          browser: chrome
          config: baseUrl=http://localhost:4173
